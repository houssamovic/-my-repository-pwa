name: Import Repository PWA source
on:
  push:
    paths:
      - '.migration-archive.b64'
      - '.github/workflows/import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack verified Cloudflare migration package
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .migration-archive.b64 > /tmp/repository-migration.zip
          unzip -t /tmp/repository-migration.zip
          unzip -o /tmp/repository-migration.zip -d .
          rm -f .migration-archive.b64
      - name: Commit imported project source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Import Cloudflare-ready Repository PWA source'
            git push
          fi
